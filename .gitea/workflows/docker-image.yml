name: Build Docker image

# Workflow générique : aucune instance n'est codée en dur. Le registre est
# déduit de l'URL du serveur Gitea (ou de la variable de dépôt REGISTRY si
# elle est définie) et l'identifiant est le propriétaire du dépôt.
# Secret requis : REGISTRY_TOKEN (jeton avec droit d'écriture sur les paquets).

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      DATA_DIR: /tmp/jellynews-test-data
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run tests
        run: |
          pip install -r requirements-dev.txt
          python -m pytest -q

  docker:
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve image name
        id: image
        env:
          REGISTRY_OVERRIDE: ${{ vars.REGISTRY }}
          SERVER_URL: ${{ gitea.server_url }}
          REPOSITORY: ${{ gitea.repository }}
        run: |
          REGISTRY="${REGISTRY_OVERRIDE:-${SERVER_URL#*://}}"
          REGISTRY="${REGISTRY%%/*}"
          echo "registry=$REGISTRY" >> "$GITHUB_OUTPUT"
          echo "image=$(echo "$REGISTRY/$REPOSITORY" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Login to Gitea registry
        env:
          REGISTRY: ${{ steps.image.outputs.registry }}
          REGISTRY_USER: ${{ gitea.repository_owner }}
          REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
        run: |
          echo "$REGISTRY_TOKEN" | docker login "$REGISTRY" -u "$REGISTRY_USER" --password-stdin

      - name: Build and push image
        env:
          IMAGE: ${{ steps.image.outputs.image }}
          SHA: ${{ gitea.sha }}
          REF_TYPE: ${{ gitea.ref_type }}
          REF_NAME: ${{ gitea.ref_name }}
        run: |
          TAGS="$IMAGE:$SHA"
          if [ "$REF_TYPE" = "tag" ]; then
            TAGS="$TAGS $IMAGE:$REF_NAME"
          else
            TAGS="$TAGS $IMAGE:latest"
          fi

          ARGS=""
          for tag in $TAGS; do ARGS="$ARGS -t $tag"; done
          docker build $ARGS .
          for tag in $TAGS; do docker push "$tag"; done
